<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Pretendard', sans-serif;
  background:#fff;
  color:#111;
}

/* 눈꽃 */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* 타이틀 */
.title {
  text-align:center;
  margin-top:60px;
}
.title-main { font-size:48px; font-family:'Poppins'; }
.title-sub {
  font-size:90px;
  font-weight:900;
  color:#111;
  -webkit-text-stroke:2px gold;
}

/* 메뉴 */
.menu {
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:40px;
}

.btn {
  min-width:260px;
  padding:24px;
  border-radius:20px;
  font-size:24px;
  font-weight:900;
  cursor:pointer;
  text-align:center;
  border:2px solid #000;
  background:#fff;
}
.active { background:#111; color:#fff; }

/* 정보 */
.info-section {
  width:95%;
  max-width:1300px;
  margin:40px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.hidden { display:none; }

/* 이벤트 */
.grid {
  width:95%;
  margin:50px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
}

.card {
  padding:35px;
  border:2px solid #000;
  border-radius:20px;
  text-align:center;
}

.card-header {
  font-size:24px;
  font-weight:900;
}

.time {
  font-size:22px;
  font-weight:800;
  margin-top:10px;
}
</style>
</head>

<body>

<canvas id="snow"></canvas>

<div class="title">
  <div class="title-main">White Out Survival</div>
  <div class="title-sub">S2515 UNI&WON</div>
</div>

<div class="menu">
  <div class="btn" onclick="resetView()">🏠 홈</div>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">🛡 UNI 연맹</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">⚔ WON 연맹</div>
</div>

<!-- 모집/공약 -->
<div class="info-section" id="infoSection">
  <!-- 그대로 유지 (너 기존 코드 유지하면 됨) -->
</div>

<!-- 이벤트 -->
<div id="content"></div>

<script>
function resetView(){
  document.getElementById("infoSection").classList.remove("hidden");
  document.getElementById("content").innerHTML="";
}

function selectTeam(team){
  document.getElementById("infoSection").classList.add("hidden");

  if(team==="UNI") renderUNI();
  else renderWON();
}

/* 🔥 이벤트 풀복구 */
function renderUNI(){
document.getElementById("content").innerHTML=`
<div class="grid">
<div class="card"><div class="card-header">🐻 곰</div>
<div class="time">1군 21:00</div>
<div class="time">2군 23:00</div></div>

<div class="card"><div class="card-header">⚙ 무공</div>
<div class="time">1군 21:00</div>
<div class="time">2군 23:00</div></div>

<div class="card"><div class="card-header">🏔 협곡</div>
<div class="time">1군 21:00</div>
<div class="time">2군 23:00</div></div>

<div class="card"><div class="card-header">🎉 조이</div>
<div class="time">21:00</div></div>
</div>`;
}

function renderWON(){
document.getElementById("content").innerHTML=`
<div class="grid">
<div class="card"><div class="card-header">🐻 곰</div>
<div class="time">1군 22:20</div>
<div class="time">2군 00:05</div></div>

<div class="card"><div class="card-header">⚙ 무공</div>
<div class="time">1군 23:00</div>
<div class="time">2군 21:00</div></div>

<div class="card"><div class="card-header">🏔 협곡</div>
<div class="time">1군 23:00</div>
<div class="time">2군 21:00</div></div>

<div class="card"><div class="card-header">🎉 조이</div>
<div class="time">21:00</div></div>
</div>`;
}

/* ❄ 눈꽃 (아이콘 복구) */
const canvas=document.getElementById("snow");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let flakes=[];
for(let i=0;i<70;i++){
flakes.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*12+8,
speed:Math.random()*1+0.5
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

flakes.forEach(f=>{
ctx.font=f.size+"px Arial";
ctx.fillStyle="#6ec6ff";
ctx.fillText("❄",f.x,f.y);

f.y+=f.speed;
if(f.y>canvas.height){
f.y=0;
f.x=Math.random()*canvas.width;
}
});

requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
