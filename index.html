<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Pretendard', sans-serif;
  background:#ffffff;
  color:#111;
}

/* 배경 */
#bg {
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* 타이틀 */
.title {
  text-align:center;
  margin-top:60px;
}

.title-main {
  font-family:'Poppins';
  font-size:48px;
}

.title-sub {
  font-family:'Poppins';
  font-size:90px;
  font-weight:900;
  color:#111;
  -webkit-text-stroke:2px gold;
}

/* 메뉴 */
.menu {
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:40px;
  flex-wrap:wrap;
}

/* 버튼 */
.btn {
  min-width:260px;
  padding:24px;
  border-radius:20px;
  font-size:24px;
  font-weight:900;
  cursor:pointer;
  text-align:center;

  background:linear-gradient(145deg,#fff,#eef5ff);
  border:2px solid rgba(0,150,255,0.3);

  box-shadow:0 10px 20px rgba(0,0,0,0.08);
  transition:0.2s;
}

.btn:hover { transform:translateY(-5px); }
.btn:active { transform:scale(0.96); }

.active {
  background:#111;
  color:#fff;
}

/* 모집/공약 */
.info-section {
  width:95%;
  max-width:1300px;
  margin:40px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.info-card {
  background:#fff;
  border-radius:25px;
  padding:35px;
  border:2px solid #e0e0e0;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.info-title {
  font-family:'Poppins';
  font-size:30px;
  font-weight:900;
  cursor:pointer;
}

.info-content {
  max-height:0;
  overflow:hidden;
  transition:0.3s;
  font-size:18px;
  line-height:1.9;
}

.info-content.open {
  max-height:3000px;
  margin-top:15px;
}

.info-content p {
  margin:8px 0;
}

/* 이벤트 */
.grid {
  width:95%;
  max-width:1400px;
  margin:30px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
}

.card {
  background:#fff;
  border-radius:20px;
  padding:25px;
  border:2px solid #e0e0e0;
  box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

.card-header {
  font-size:22px;
  font-weight:900;
}

.time-box {
  background:#f9fbff;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  border:1px solid #ccc;
}

.time { font-size:28px; font-weight:900; }
.utc { font-size:13px; }

/* 모바일 */
@media(max-width:900px){
  .grid {display:flex; overflow-x:auto;}
  .card {min-width:260px;}
  .info-section {grid-template-columns:1fr;}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="title">
  <div class="title-main">White Out Survival</div>
  <div class="title-sub">S2515 UNI&WON</div>
</div>

<div class="menu">
  <div class="btn" onclick="goLink()">💬 이민 문의</div>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">🛡 UNI 연맹</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">⚔ WON 연맹</div>
</div>

<div class="info-section">

<div class="info-card">
<div class="info-title" onclick="toggleInfo(this)">💙 모집 대상</div>
<div class="info-content">
<p>💙 모집 대상</p>
<p>· 개인 / 소규모 / 단체 이민 모두 환영합니다</p>
<p>(4월 특초 2장 가능 / 6주 기준 5월 1일 추가 지급 포함)</p>
<p>· UNI : 소수 / WON : 단체 수용 (최대 50명)</p>
<p>· 누구나 환영 :)</p>
</div>
</div>

<div class="info-card">
<div class="info-title" onclick="toggleInfo(this)">📜 서버 공약</div>
<div class="info-content">
<p>💙 엔센 12개 보장</p>
<p>💙 서버전 12전 9승</p>
<p>💙 초기 정착 지원</p>
</div>
</div>

</div>

<div id="content"></div>

<script>
function goLink(){
  window.open("https://open.kakao.com/o/sL7u8cYh","_blank");
}

function toggleInfo(el){
  el.nextElementSibling.classList.toggle("open");
}

function selectTeam(team){
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");

  if(team==="UNI"){
    document.getElementById("uniBtn").classList.add("active");
    renderUNI();
  } else {
    document.getElementById("wonBtn").classList.add("active");
    renderWON();
  }
}

/* 🔥 이벤트 완전 복구 */
function renderUNI(){
document.getElementById("content").innerHTML=`
<div class="grid">

<div class="card"><div class="card-header">🐻 곰</div>
<div class="time-box"><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
<div class="time-box"><div class="time">22:00</div><div class="utc">(UTC 13:00)</div></div>
<div class="time-box"><div class="time">23:10</div><div class="utc">(UTC 14:10)</div></div>
</div>

<div class="card"><div class="card-header">⚙ 무공</div>
<div class="time-box"><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
<div class="time-box"><div class="time">23:00</div><div class="utc">(UTC 14:00)</div></div>
</div>

<div class="card"><div class="card-header">🏔 협곡</div>
<div class="time-box"><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
<div class="time-box"><div class="time">23:00</div><div class="utc">(UTC 14:00)</div></div>
</div>

<div class="card"><div class="card-header">🎉 조이</div>
<div class="time-box"><div class="time">22:00</div><div class="utc">(UTC 13:00)</div></div>
</div>

</div>`;
}

function renderWON(){
document.getElementById("content").innerHTML=`
<div class="grid">

<div class="card"><div class="card-header">🐻 곰</div>
<div class="time-box"><div class="time">22:20</div><div class="utc">(UTC 13:20)</div></div>
<div class="time-box"><div class="time">00:05</div><div class="utc">(UTC 15:05)</div></div>
</div>

<div class="card"><div class="card-header">⚙ 무공</div>
<div class="time-box"><div class="time">23:00</div><div class="utc">(UTC 14:00)</div></div>
<div class="time-box"><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
</div>

<div class="card"><div class="card-header">🏔 협곡</div>
<div class="time-box"><div class="time">23:00</div><div class="utc">(UTC 14:00)</div></div>
<div class="time-box"><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
</div>

<div class="card"><div class="card-header">🎉 조이</div>
<div class="time-box"><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
</div>

</div>`;
}

/* 눈꽃 */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();

let flakes=[];
for(let i=0;i<40;i++){
flakes.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
a:Math.random(),
f:Math.random()*0.02
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

flakes.forEach(f=>{
ctx.fillStyle=`rgba(0,150,255,${f.a})`;
ctx.font="18px Arial";
ctx.fillText("❄",f.x,f.y);

f.a+=f.f;
if(f.a>1||f.a<0) f.f*=-1;
});

requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
