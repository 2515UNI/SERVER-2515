<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  color:#222;
  text-align:center;
  background: linear-gradient(270deg, #dff3ff, #ffffff, #eaf8ff);
  background-size: 600% 600%;
  animation: bgMove 10s ease infinite;
}

@keyframes bgMove {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

h1 {
  margin-top:30px;
}

/* 버튼 */
.menu {
  margin:20px;
}

.btn {
  display:inline-block;
  margin:6px;
  padding:10px 20px;
  border-radius:10px;
  background:#2c3e50;
  color:white;
  cursor:pointer;
}

.active {
  background:#3498db;
}

/* 카드 */
.card {
  width:360px;
  margin:25px auto;
  padding:20px;
  border-radius:15px;
  background:white;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* 탭 */
.tab {
  display:inline-block;
  margin:5px;
  padding:8px 12px;
  border-radius:8px;
  background:#ddd;
  cursor:pointer;
}

.tab.active {
  background:#3498db;
  color:white;
}

/* 이벤트 카드 */
.event-box {
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  color:white;
  font-size:18px;
  animation:fadeUp 0.4s ease;
}

@keyframes fadeUp {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

/* 색상 구분 */
.bear { background:#e67e22; }
.factory { background:#7f8c8d; }
.valley { background:#27ae60; }
.joy { background:#9b59b6; }

.time {
  font-size:24px;
  font-weight:bold;
  margin-top:5px;
}
</style>
</head>

<body>

<h1>🔥 SERVER 2515 🔥</h1>

<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">이민 문의</a>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">UNI</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">WON</div>
</div>

<div id="content"></div>

<script>
let currentTeam = "";
let currentTab = "bear";

function selectTeam(team) {
  currentTeam = team;
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");
  document.getElementById(team.toLowerCase()+"Btn").classList.add("active");
  render();
}

function selectTab(tab) {
  currentTab = tab;
  render();
}

function render() {
  if (!currentTeam) return;

  let html = `
    <div class="card">
      <div><b>${currentTeam} 연맹</b></div>

      <div>
        <div class="tab ${currentTab==='bear'?'active':''}" onclick="selectTab('bear')">🐻</div>
        <div class="tab ${currentTab==='factory'?'active':''}" onclick="selectTab('factory')">⚙</div>
        <div class="tab ${currentTab==='valley'?'active':''}" onclick="selectTab('valley')">🏔</div>
        <div class="tab ${currentTab==='joy'?'active':''}" onclick="selectTab('joy')">🎉</div>
      </div>
  `;

  if (currentTeam === "UNI") {
    if (currentTab === "bear") {
      html += `
        <div class="event-box bear">
          곰 사냥
          <div class="time">21:00 / 22:00 / 23:10</div>
        </div>`;
    }
    if (currentTab === "factory") {
      html += `
        <div class="event-box factory">
          무기공장
          <div class="time">21:00 / 22:00</div>
        </div>`;
    }
    if (currentTab === "valley") {
      html += `
        <div class="event-box valley">
          협곡
          <div class="time">21:00 / 22:00</div>
        </div>`;
    }
    if (currentTab === "joy") {
      html += `
        <div class="event-box joy">
          조이
          <div class="time">22:00</div>
        </div>`;
    }
  }

  if (currentTeam === "WON") {
    if (currentTab === "bear") {
      html += `
        <div class="event-box bear">
          곰 사냥
          <div class="time">22:30 / 24:00</div>
        </div>`;
    } else {
      html += `<div class="event-box factory">정보 없음</div>`;
    }
  }

  html += `</div>`;
  document.getElementById("content").innerHTML = html;
}
</script>

</body>
</html>
