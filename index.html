<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1a24;
  color:white;
  text-align:center;
}

/* 눈 효과 */
.snow {
  position:fixed;
  width:100%;
  height:100%;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size:20px 20px;
  animation:snow 20s linear infinite;
  opacity:0.2;
}

@keyframes snow {
  from { transform: translateY(-100px); }
  to { transform: translateY(100vh); }
}

h1 {
  margin-top:50px;
  font-size:45px;
}

/* 메뉴 */
.menu {
  margin:30px;
}

.btn {
  display:block;
  width:220px;
  margin:10px auto;
  padding:12px;
  background:#1f3a4a;
  border-radius:10px;
  color:white;
  text-decoration:none;
  cursor:pointer;
}

.btn:hover {
  background:#00ccff;
}

/* 내용 */
.content {
  margin-top:20px;
}

/* 박스 */
.box {
  width:320px;
  margin:20px auto;
  padding:15px;
  background:#1a2a35;
  border-radius:10px;
  text-align:left;
}

.title {
  text-align:center;
  font-size:22px;
  color:#00ccff;
}

.section {
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="snow"></div>

<h1>SERVER 2515</h1>

<!-- 메뉴 -->
<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">이민 문의</a>
  <div class="btn" onclick="showUNI()">UNI 연맹소개</div>
  <div class="btn" onclick="showKOR()">KOR 연맹소개</div>
</div>

<!-- 내용 표시 -->
<div class="content" id="content">
  <p>연맹을 선택하세요</p>
</div>

<script>
function showUNI() {
  document.getElementById("content").innerHTML = `
    <div class="box">
      <div class="title">UNI 연맹</div>

      <div class="section">곰</div>
      <p>곰 1 : 21:00</p>
      <p>곰 2 : 22:00</p>
      <p>곰 3 : 23:10</p>

      <div class="section">무기공장</div>
      <p>1군 : 21:00</p>
      <p>2군 : 22:00</p>

      <div class="section">협곡</div>
      <p>1군 : 21:00</p>
      <p>2군 : 22:00</p>

      <div class="section">조이</div>
      <p>22:00</p>
    </div>
  `;
}

function showKOR() {
  document.getElementById("content").innerHTML = `
    <div class="box">
      <div class="title">KOR 연맹</div>

      <div class="section">곰</div>
      <p>곰 1 : 22:30</p>
      <p>곰 2 : 24:00</p>
    </div>
  `;
}
</script>

</body>
</html>
