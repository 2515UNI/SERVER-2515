<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
body {margin:0;font-family:'Pretendard';background:#fff;color:#111;}
canvas {position:fixed;top:0;left:0;z-index:-1;}

/* 타이틀 */
.title {text-align:center;margin-top:60px;}
.title-main {font-size:42px;}
.title-sub {
  font-size:80px;
  font-weight:900;
  -webkit-text-stroke:2px gold;
}

/* 메뉴 */
.menu {
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:40px;
  flex-wrap:wrap;
}

.btn {
  min-width:220px;
  padding:20px;
  border-radius:18px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(0,0,0,0.1);
  background:linear-gradient(145deg,#ffffff,#f3f3f3);

  box-shadow:
    0 6px 15px rgba(0,0,0,0.08),
    inset 0 1px 0 rgba(255,255,255,0.8);

  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
}

/* ✨ 빛 흐르는 효과 */
.btn::after{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:50%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.8),transparent);
  transition:all 0.6s;
}

.btn:hover::after{
  left:120%;
}

.btn:hover {
  transform:translateY(-4px);
  box-shadow:0 12px 25px rgba(0,0,0,0.12);
}

.btn.active {
  background:linear-gradient(145deg,#ffffff,#eaeaea);
}

/* 정보 */
.info-section {
  width:95%;
  max-width:1300px;
  margin:40px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.info-card {
  padding:35px;
  border-radius:22px;
  background:linear-gradient(145deg,#ffffff,#f3f3f3);
  border:1px solid rgba(0,0,0,0.08);
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.info-title {font-size:26px;font-weight:900;}
.info-content {font-size:16px;line-height:1.9;font-weight:700;}

.hidden {display:none;}

/* 이벤트 */
.grid {
  width:95%;
  margin:40px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card {
  padding:30px;
  border-radius:22px;
  background:linear-gradient(145deg,#ffffff,#f3f3f3);
  border:1px solid rgba(0,0,0,0.08);
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  opacity:0;
  transform:translateY(30px);
}

/* ✨ 순차 등장 */
.card.show {
  animation:fadeUp 0.6s ease forwards;
}

@keyframes fadeUp {
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.card-header {
  font-size:24px;
  font-weight:900;
  margin-bottom:15px;
}

.time-box {
  border:1px solid rgba(0,0,0,0.08);
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  background:#fafafa;
}

.time {font-size:20px;font-weight:900;}
.utc {font-size:13px;color:#777;}

/* 모바일 */
@media(max-width:900px){
  .grid {grid-template-columns:repeat(2,1fr);}
  .info-section {grid-template-columns:1fr;}
}

@media(max-width:500px){
  .grid {grid-template-columns:1fr;}
  .title-sub {font-size:50px;}
  .btn {min-width:160px;font-size:16px;padding:16px;}
}

/* 하단 */
.footer {
  text-align:center;
  margin:60px 0 30px;
  font-size:14px;
  color:#777;
}
</style>
</head>

<body>

<canvas id="snow"></canvas>

<div class="title">
  <div class="title-main">White Out Survival</div>
  <div class="title-sub">S2515 UNI&WON</div>
</div>

<div class="menu">
  <div class="btn" onclick="goLink()">💬 이민 문의</div>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">🛡 UNI 연맹</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">⚔ WON 연맹</div>
</div>

<!-- 기존 정보 그대로 유지 -->
<div class="info-section" id="infoSection">...</div>

<div id="content"></div>

<div class="footer">
Made in 우짱
</div>

<script>
function goLink(){
  window.open("https://open.kakao.com/o/sL7u8cYh","_blank");
}

function selectTeam(team){
  document.getElementById("infoSection").classList.add("hidden");

  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");

  if(team==="UNI"){
    document.getElementById("uniBtn").classList.add("active");
    renderUNI();
  } else {
    document.getElementById("wonBtn").classList.add("active");
    renderWON();
  }

  setTimeout(showCards,50);
}

/* ✨ 카드 순차 등장 */
function showCards(){
  const cards=document.querySelectorAll(".card");
  cards.forEach((card,i)=>{
    setTimeout(()=>{
      card.classList.add("show");
    },i*120);
  });
}

/* 기존 데이터 그대로 유지 */
function renderUNI(){
document.getElementById("content").innerHTML=`... (여기 기존 그대로)`;
}
function renderWON(){
document.getElementById("content").innerHTML=`... (여기 기존 그대로)`;
}

/* 눈 */
const canvas=document.getElementById("snow");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let flakes=[];
for(let i=0;i<60;i++){
flakes.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*8+5,speed:Math.random()*1});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
flakes.forEach(f=>{
ctx.font=f.size+"px Arial";
ctx.fillStyle="#6ec6ff";
ctx.fillText("❄",f.x,f.y);
f.y+=f.speed;
if(f.y>canvas.height){f.y=0;f.x=Math.random()*canvas.width;}
});
requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
