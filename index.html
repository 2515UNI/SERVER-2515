<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Pretendard', sans-serif;
  background:#f8fafc;
  overflow-x:hidden;
  color:#111;
}

/* 배경 */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* 타이틀 */
.title {
  text-align:center;
  font-size:60px;
  font-weight:900;
  margin:50px 0 20px;
}

/* 메뉴 */
.menu { text-align:center; }

.btn {
  display:inline-block;
  margin:10px;
  padding:16px 34px;
  border-radius:16px;
  background:white;
  border:2px solid #ddd;
  cursor:pointer;
  font-size:18px;
  font-weight:600;
  transition:0.2s;
}
.btn:hover { background:#111; color:white; }
.active { background:#111; color:white; }

/* 모집/공약 카드 */
.info-section {
  width:95%;
  max-width:1100px;
  margin:30px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.info-card {
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.info-title {
  font-size:24px;
  font-weight:900;
  margin-bottom:15px;
}

.info-item {
  background:#f1f5f9;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  font-size:17px;
  font-weight:600;
}

/* 이벤트 카드 */
.grid {
  width:95%;
  max-width:1400px;
  margin:30px auto;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:25px;
}

.card {
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.card-header {
  font-size:22px;
  font-weight:800;
}

.time-box {
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  border:1.5px solid #ccc;
}

.label {
  font-size:14px;
  font-weight:700;
}

.time {
  font-size:30px;
  font-weight:900;
}

.utc {
  font-size:12px;
  color:#333;
}

.active-event {
  border:2px solid #00ccff;
  box-shadow:0 0 10px rgba(0,200,255,0.3);
}

/* 모바일 */
@media (max-width:900px){
  .grid { display:flex; overflow-x:auto; }
  .card { min-width:280px; }
  .info-section { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="title">🚀 SERVER 2515</div>

<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">💬 이민 문의</a>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">🛡 UNI</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">⚔ WON</div>
</div>

<!-- 모집 / 공약 -->
<div class="info-section">

  <div class="info-card">
    <div class="info-title">💙 모집 대상</div>
    <div class="info-item">단체 이민 / 특초 개인 이민</div>
    <div class="info-item">4~5월 단체 이동 예정</div>
    <div class="info-item">KOR 합병 및 단체 이동 환영</div>
    <div class="info-item">전투 & 서버전 중심 유저</div>
    <div class="info-item">안정적인 연맹 원하는 분</div>
  </div>

  <div class="info-card">
    <div class="info-title">📜 서버 공약</div>
    <div class="info-item">12개 엔센 보장 (4레벨 포함)</div>
    <div class="info-item">요새 4 / 성채 1 제공</div>
    <div class="info-item">서버전 12전 9승</div>
    <div class="info-item">연맹 협력 및 합병 가능</div>
    <div class="info-item">초기 정착 전폭 지원</div>
  </div>

</div>

<div id="content"></div>

<script>
/* 배경 입자 */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2,
    d:Math.random()*1
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="rgba(0,0,0,0.1)";
  ctx.beginPath();
  particles.forEach(p=>{
    ctx.moveTo(p.x,p.y);
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  });
  ctx.fill();
  update();
}

function update(){
  particles.forEach(p=>{
    p.y+=p.d;
    if(p.y>canvas.height){
      p.y=0;
      p.x=Math.random()*canvas.width;
    }
  });
}

setInterval(draw,30);

/* 이벤트 강조 */
function getActiveClass(h,m){
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const target=h*60+m;
  return Math.abs(nowMin-target)<30?"active-event":"";
}

function selectTeam(team){
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");
  document.getElementById(team.toLowerCase()+"Btn").classList.add("active");

  if(team==="UNI") renderUNI();
  else renderWON();
}

/* UNI */
function renderUNI(){
document.getElementById("content").innerHTML=`
<div class="grid">

  <div class="card">
    <div class="card-header">🐻 곰 사냥</div>
    <div class="time-box ${getActiveClass(21,0)}"><div class="label">곰1</div><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
    <div class="time-box ${getActiveClass(22,0)}"><div class="label">곰2</div><div class="time">22:00</div><div class="utc">(UTC 13:00)</div></div>
    <div class="time-box ${getActiveClass(23,10)}"><div class="label">곰3</div><div class="time">23:10</div><div class="utc">(UTC 14:10)</div></div>
  </div>

  <div class="card">
    <div class="card-header">⚙ 무기공장</div>
    <div class="time-box ${getActiveClass(21,0)}"><div class="label">1군</div><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
    <div class="time-box ${getActiveClass(22,0)}"><div class="label">2군</div><div class="time">22:00</div><div class="utc">(UTC 13:00)</div></div>
  </div>

  <div class="card">
    <div class="card-header">🏔 협곡</div>
    <div class="time-box ${getActiveClass(21,0)}"><div class="label">1군</div><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
    <div class="time-box ${getActiveClass(22,0)}"><div class="label">2군</div><div class="time">22:00</div><div class="utc">(UTC 13:00)</div></div>
  </div>

  <div class="card">
    <div class="card-header">🎉 조이</div>
    <div class="time-box ${getActiveClass(22,0)}"><div class="label">이벤트</div><div class="time">22:00</div><div class="utc">(UTC 13:00)</div></div>
  </div>

</div>`;
}

/* WON */
function renderWON(){
document.getElementById("content").innerHTML=`
<div class="grid">

  <div class="card">
    <div class="card-header">🐻 곰 사냥</div>
    <div class="time-box ${getActiveClass(22,20)}"><div class="label">곰1</div><div class="time">22:20</div><div class="utc">(UTC 13:20)</div></div>
    <div class="time-box ${getActiveClass(0,5)}"><div class="label">곰2</div><div class="time">00:05</div><div class="utc">(UTC 15:05)</div></div>
  </div>

  <div class="card">
    <div class="card-header">⚙ 무기공장</div>
    <div class="time-box ${getActiveClass(23,0)}"><div class="label">1군</div><div class="time">23:00</div><div class="utc">(UTC 14:00)</div></div>
    <div class="time-box ${getActiveClass(21,0)}"><div class="label">2군</div><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
  </div>

  <div class="card">
    <div class="card-header">🏔 협곡</div>
    <div class="time-box ${getActiveClass(23,0)}"><div class="label">1군</div><div class="time">23:00</div><div class="utc">(UTC 14:00)</div></div>
    <div class="time-box ${getActiveClass(21,0)}"><div class="label">2군</div><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
  </div>

  <div class="card">
    <div class="card-header">🎉 조이</div>
    <div class="time-box ${getActiveClass(21,0)}"><div class="label">이벤트</div><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
  </div>

</div>`;
}
</script>

</body>
</html>
