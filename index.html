<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  color:#fff;
  overflow-x:hidden;

  background: radial-gradient(circle at top, #1b2735, #090a0f);
}

/* 배경 떠다니는 숫자 */
.bg-text {
  position:fixed;
  font-size:80px;
  color:rgba(255,255,255,0.03);
  animation: float 15s linear infinite;
}

@keyframes float {
  0% {transform:translateY(100vh);}
  100% {transform:translateY(-120vh);}
}

/* 제목 */
h1 {
  text-align:center;
  margin-top:30px;
  font-size:42px;
  text-shadow:0 0 15px #00ccff;
}

/* 메뉴 */
.menu {
  text-align:center;
  margin:20px;
}

.btn {
  display:inline-block;
  margin:8px;
  padding:14px 24px;
  border-radius:12px;
  background:rgba(255,255,255,0.1);
  backdrop-filter: blur(6px);
  color:white;
  cursor:pointer;
  font-size:16px;
  transition:0.3s;
}

.btn:hover {
  background:#00ccff;
  color:black;
}

.active {
  background:#00ccff;
  color:black;
}

/* 카드 영역 */
.grid {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:20px;
  width:90%;
  margin:30px auto;
}

/* 카드 */
.card {
  background:rgba(255,255,255,0.05);
  border-radius:18px;
  padding:20px;
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  transition:0.3s;
  position:relative;
}

.card:hover {
  transform:translateY(-8px);
  box-shadow:0 10px 30px rgba(0,200,255,0.3);
}

/* 카드 상단 */
.card-header {
  font-size:20px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* 시간 박스 */
.time-box {
  background:rgba(0,0,0,0.4);
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}

.time {
  font-size:22px;
  font-weight:bold;
}

/* 색 강조 */
.bear { border-left:4px solid #e67e22; }
.factory { border-left:4px solid #95a5a6; }
.valley { border-left:4px solid #2ecc71; }
.joy { border-left:4px solid #9b59b6; }

/* 모바일 */
@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .btn {
    width:80%;
  }
}
</style>
</head>

<body>

<!-- 배경 텍스트 -->
<div class="bg-text" style="left:10%">2515</div>
<div class="bg-text" style="left:50%; animation-delay:5s;">2515</div>
<div class="bg-text" style="left:80%; animation-delay:10s;">2515</div>

<h1>🔥 SERVER 2515 🔥</h1>

<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">💬 이민 문의</a>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">🛡 UNI</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">⚔ WON</div>
</div>

<div id="content"></div>

<script>
function selectTeam(team) {
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");
  document.getElementById(team.toLowerCase()+"Btn").classList.add("active");

  if (team === "UNI") renderUNI();
  else renderWON();
}

function renderUNI() {
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card bear">
        <div class="card-header">🐻 곰 사냥</div>
        <div class="time-box">곰1 <div class="time">21:00</div></div>
        <div class="time-box">곰2 <div class="time">22:00</div></div>
        <div class="time-box">곰3 <div class="time">23:10</div></div>
      </div>

      <div class="card factory">
        <div class="card-header">⚙ 무기공장</div>
        <div class="time-box">1군 <div class="time">21:00</div></div>
        <div class="time-box">2군 <div class="time">22:00</div></div>
      </div>

      <div class="card valley">
        <div class="card-header">🏔 협곡</div>
        <div class="time-box">1군 <div class="time">21:00</div></div>
        <div class="time-box">2군 <div class="time">22:00</div></div>
      </div>

      <div class="card joy">
        <div class="card-header">🎉 조이</div>
        <div class="time-box">이벤트 <div class="time">22:00</div></div>
      </div>

    </div>
  `;
}

function renderWON() {
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card bear">
        <div class="card-header">🐻 곰 사냥</div>
        <div class="time-box">곰1 <div class="time">22:30</div></div>
        <div class="time-box">곰2 <div class="time">24:00</div></div>
      </div>

      <div class="card factory"><div class="card-header">⚙ 무기공장</div><div class="time-box">정보 없음</div></div>
      <div class="card valley"><div class="card-header">🏔 협곡</div><div class="time-box">정보 없음</div></div>
      <div class="card joy"><div class="card-header">🎉 조이</div><div class="time-box">정보 없음</div></div>

    </div>
  `;
}
</script>

</body>
</html>
