<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(270deg, #dff3ff, #ffffff, #eaf8ff);
  background-size: 600% 600%;
  animation: bgMove 12s ease infinite;
}

@keyframes bgMove {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

h1 {
  text-align:center;
  margin-top:30px;
}

/* 버튼 */
.menu {
  text-align:center;
  margin:20px;
}

.btn {
  display:inline-block;
  margin:10px;
  padding:14px 25px;
  border-radius:12px;
  background:#2c3e50;
  color:white;
  cursor:pointer;
  font-size:18px;
}

.active {
  background:#3498db;
}

/* 카드 전체 */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap:20px;
  width:90%;
  margin:30px auto;
}

/* 카드 */
.card {
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  transition:0.3s;
}

.card:hover {
  transform:translateY(-5px);
}

/* 제목 */
.title {
  font-size:20px;
  margin-bottom:10px;
}

/* 시간 */
.time-box {
  background:#f4f4f4;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}

.time {
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🔥 SERVER 2515 🔥</h1>

<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">이민 문의</a>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">UNI</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">WON</div>
</div>

<div id="content"></div>

<script>
function selectTeam(team) {
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");
  document.getElementById(team.toLowerCase()+"Btn").classList.add("active");

  if (team === "UNI") {
    renderUNI();
  } else {
    renderWON();
  }
}

function renderUNI() {
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card">
        <div class="title">🐻 곰 사냥</div>
        <div class="time-box">곰1 <div class="time">21:00</div></div>
        <div class="time-box">곰2 <div class="time">22:00</div></div>
        <div class="time-box">곰3 <div class="time">23:10</div></div>
      </div>

      <div class="card">
        <div class="title">⚙ 무기공장</div>
        <div class="time-box">1군 <div class="time">21:00</div></div>
        <div class="time-box">2군 <div class="time">22:00</div></div>
      </div>

      <div class="card">
        <div class="title">🏔 협곡</div>
        <div class="time-box">1군 <div class="time">21:00</div></div>
        <div class="time-box">2군 <div class="time">22:00</div></div>
      </div>

      <div class="card">
        <div class="title">🎉 조이</div>
        <div class="time-box">이벤트 <div class="time">22:00</div></div>
      </div>

    </div>
  `;
}

function renderWON() {
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card">
        <div class="title">🐻 곰 사냥</div>
        <div class="time-box">곰1 <div class="time">22:30</div></div>
        <div class="time-box">곰2 <div class="time">24:00</div></div>
      </div>

      <div class="card">
        <div class="title">⚙ 무기공장</div>
        <div class="time-box">정보 없음</div>
      </div>

      <div class="card">
        <div class="title">🏔 협곡</div>
        <div class="time-box">정보 없음</div>
      </div>

      <div class="card">
        <div class="title">🎉 조이</div>
        <div class="time-box">정보 없음</div>
      </div>

    </div>
  `;
}
</script>

</body>
</html>
