<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  color:#111;
  text-align:center;
  background: linear-gradient(#e9f3f9, #ffffff); /* 화이트 느낌 */
}

/* 눈 효과 */
.snow {
  position:fixed;
  width:100%;
  height:100%;
  background-image: radial-gradient(white 2px, transparent 2px);
  background-size:25px 25px;
  animation:snow 15s linear infinite;
  opacity:0.4;
  pointer-events:none;
}

@keyframes snow {
  from { transform: translateY(-100px); }
  to { transform: translateY(100vh); }
}

/* 제목 */
h1 {
  margin-top:40px;
  font-size:48px;
  color:#111;
  text-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* 버튼 */
.menu {
  margin:30px;
}

.btn {
  display:block;
  width:240px;
  margin:12px auto;
  padding:14px;
  border-radius:12px;
  background: linear-gradient(135deg, #2c3e50, #1a252f);
  color:white;
  text-decoration:none; /* ⭐ 밑줄 제거 */
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover {
  transform:scale(1.05);
  background: linear-gradient(135deg, #3498db, #2980b9);
}

/* 선택된 버튼 */
.active {
  background: linear-gradient(135deg, #3498db, #1f5f8a);
  box-shadow:0 0 10px rgba(0,0,0,0.3);
}

/* 내용 박스 */
.box {
  width:340px;
  margin:20px auto;
  padding:20px;
  border-radius:15px;
  background:white;
  text-align:left;
  box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

/* 제목 */
.title {
  text-align:center;
  font-size:24px;
  color:#2c3e50;
  margin-bottom:15px;
}

/* 섹션 */
.section {
  margin-top:15px;
  font-weight:bold;
  color:#2980b9;
}
</style>
</head>

<body>

<div class="snow"></div>

<h1>SERVER 2515</h1>

<!-- 메뉴 -->
<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">💬 이민 문의</a>
  <div class="btn" id="btnUNI" onclick="showUNI()">🛡 UNI 연맹소개</div>
  <div class="btn" id="btnKOR" onclick="showKOR()">⚔ KOR 연맹소개</div>
</div>

<!-- 내용 -->
<div id="content">
  <p>연맹을 선택하세요</p>
</div>

<script>
function resetActive() {
  document.getElementById("btnUNI").classList.remove("active");
  document.getElementById("btnKOR").classList.remove("active");
}

function showUNI() {
  resetActive();
  document.getElementById("btnUNI").classList.add("active");

  document.getElementById("content").innerHTML = `
    <div class="box">
      <div class="title">🛡 UNI 연맹</div>

      <div class="section">🐻 곰</div>
      <p>곰 1 : 21:00</p>
      <p>곰 2 : 22:00</p>
      <p>곰 3 : 23:10</p>

      <div class="section">⚙ 무기공장</div>
      <p>1군 : 21:00</p>
      <p>2군 : 22:00</p>

      <div class="section">🏔 협곡</div>
      <p>1군 : 21:00</p>
      <p>2군 : 22:00</p>

      <div class="section">🎉 조이</div>
      <p>22:00</p>
    </div>
  `;
}

function showKOR() {
  resetActive();
  document.getElementById("btnKOR").classList.add("active");

  document.getElementById("content").innerHTML = `
    <div class="box">
      <div class="title">⚔ KOR 연맹</div>

      <div class="section">🐻 곰</div>
      <p>곰 1 : 22:30</p>
      <p>곰 2 : 24:00</p>
    </div>
  `;
}
</script>

</body>
</html>
