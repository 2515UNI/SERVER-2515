<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#f4f6fb;
  color:#111;
}

/* 타이틀 */
.title {
  text-align:center;
  font-size:52px;
  font-weight:bold;
  margin:40px 0;
  letter-spacing:2px;
  animation: drop 0.8s ease;
}

@keyframes drop {
  from {transform:translateY(-60px); opacity:0;}
  to {transform:translateY(0); opacity:1;}
}

/* 메뉴 */
.menu {
  text-align:center;
  margin-bottom:20px;
}

.btn {
  display:inline-block;
  margin:8px;
  padding:14px 26px;
  border-radius:14px;
  background:white;
  border:1px solid #ddd;
  cursor:pointer;
  font-size:16px;
  transition:0.3s;
}

.btn:hover {
  background:#111;
  color:white;
}

.active {
  background:#111;
  color:white;
}

/* 🔥 4칸 고정 */
.grid {
  width:95%;
  max-width:1400px;
  margin:30px auto;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:20px;
}

/* 카드 */
.card {
  background:linear-gradient(145deg,#1c1f2a,#111);
  color:white;
  border-radius:25px;
  padding:25px;
  position:relative;
  overflow:hidden;
  transition:0.3s;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* 상단 라인 효과 */
.card::before {
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:3px;
  background:linear-gradient(90deg,#00ccff,#9b59b6);
}

/* hover */
.card:hover {
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 0 25px rgba(0,200,255,0.4);
}

/* 제목 */
.card-header {
  font-size:26px;
  margin-bottom:15px;
}

/* 시간 박스 */
.time-box {
  background:#0d0f14;
  border-radius:18px;
  padding:18px;
  margin-top:15px;
  border:1px solid rgba(255,255,255,0.05);
}

/* 라벨 */
.label {
  color:#f1c40f;
  font-size:14px;
}

/* 시간 (게임 느낌) */
.time {
  font-size:36px;
  font-weight:bold;
  margin-top:5px;
  letter-spacing:1px;
}

/* UTC */
.utc {
  font-size:12px;
  color:#aaa;
  margin-top:5px;
}

/* 모바일 (스크롤 허용) */
@media (max-width:900px){
  .grid {
    display:flex;
    overflow-x:auto;
  }
  .card {
    min-width:280px;
  }
}
</style>
</head>

<body>

<div class="title">🚀 SERVER 2515</div>

<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">💬 이민 문의</a>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">UNI</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">WON</div>
</div>

<div id="content"></div>

<script>
function selectTeam(team){
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");
  document.getElementById(team.toLowerCase()+"Btn").classList.add("active");

  if(team==="UNI") renderUNI();
  else renderWON();
}

function renderUNI(){
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card">
        <div class="card-header">🐻 곰 사냥</div>
        <div class="time-box"><div class="label">곰1</div><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
        <div class="time-box"><div class="label">곰2</div><div class="time">22:00</div><div class="utc">(UTC 13:00)</div></div>
        <div class="time-box"><div class="label">곰3</div><div class="time">23:10</div><div class="utc">(UTC 14:10)</div></div>
      </div>

      <div class="card">
        <div class="card-header">⚙ 무기공장</div>
        <div class="time-box"><div class="label">1군</div><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
        <div class="time-box"><div class="label">2군</div><div class="time">23:00</div><div class="utc">(UTC 14:00)</div></div>
      </div>

      <div class="card">
        <div class="card-header">🏔 협곡</div>
        <div class="time-box"><div class="label">1군</div><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
        <div class="time-box"><div class="label">2군</div><div class="time">23:00</div><div class="utc">(UTC 14:00)</div></div>
      </div>

      <div class="card">
        <div class="card-header">🎉 조이</div>
        <div class="time-box"><div class="label">이벤트</div><div class="time">22:00</div><div class="utc">(UTC 13:00)</div></div>
      </div>

    </div>
  `;
}

function renderWON(){
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card">
        <div class="card-header">🐻 곰 사냥</div>
        <div class="time-box"><div class="label">곰1</div><div class="time">22:30</div><div class="utc">(UTC 13:30)</div></div>
        <div class="time-box"><div class="label">곰2</div><div class="time">24:00</div><div class="utc">(UTC 15:00)</div></div>
      </div>

    </div>
  `;
}
</script>

</body>
</html>
