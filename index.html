<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snow Test</title>

<style>
body {
  margin:0;
  background:#111; /* 테스트용 어두운 배경 */
}

/* 캔버스 */
#bg {
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:0;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

/* ⭐ 핵심: 실제 픽셀 크기 강제 지정 */
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* ❄ 눈 */
let snow = [];
for(let i=0;i<100;i++){
  snow.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*3+1,
    speed:Math.random()*1+0.5,
    drift:Math.random()*0.6-0.3
  });
}

/* ✨ 빛 */
let glow = [];
for(let i=0;i<50;i++){
  glow.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2+1,
    alpha:Math.random(),
    fade:Math.random()*0.02
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* ❄ 눈 */
  ctx.fillStyle="white";
  snow.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();

    s.y+=s.speed;
    s.x+=s.drift;

    if(s.y>canvas.height){
      s.y=0;
      s.x=Math.random()*canvas.width;
    }
  });

  /* ✨ 빛 */
  glow.forEach(g=>{
    ctx.beginPath();
    ctx.arc(g.x,g.y,g.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${g.alpha})`;
    ctx.fill();

    g.alpha+=g.fade;
    if(g.alpha>1 || g.alpha<0) g.fade*=-1;
  });

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
