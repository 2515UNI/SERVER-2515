<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Pretendard', sans-serif;
  background:#ffffff;
}

/* 배경 */
#bg {
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* 타이틀 */
.title {
  text-align:center;
  margin-top:60px;
}

.title-main {
  font-size:48px;
  font-family:'Poppins';
}

.title-sub {
  font-size:90px;
  font-weight:900;
  color:#111;
  -webkit-text-stroke:2px gold;
}

/* 메뉴 */
.menu {
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:40px;
}

/* 버튼 (크게) */
.btn {
  min-width:260px;
  padding:26px;
  border-radius:22px;
  font-size:24px;
  font-weight:900;
  text-align:center;
  cursor:pointer;

  background:white;
  border:2px solid #ccc;

  transition:0.2s;
}

.btn:hover {
  transform:translateY(-5px);
}

.active {
  background:#111;
  color:white;
}

/* 모집/공약 */
.info-section {
  width:95%;
  max-width:1300px;
  margin:40px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.info-card {
  background:white;
  padding:35px;
  border-radius:25px;
}

.info-title {
  font-size:30px;
  font-weight:900;
  cursor:pointer;
}

.info-content {
  max-height:0;
  overflow:hidden;
  transition:0.3s;
  font-size:18px;
  line-height:1.8;
}

.info-content.open {
  max-height:3000px;
}

/* 이벤트 */
.grid {
  width:95%;
  margin:30px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card {
  background:white;
  padding:25px;
  border-radius:20px;
}

.card-header {
  font-size:22px;
  font-weight:900;
}

.time-box {
  margin-top:10px;
}

.time {
  font-size:28px;
  font-weight:900;
}

.utc {
  font-size:13px;
}

/* 모바일 */
@media(max-width:900px){
  .grid {display:flex; overflow-x:auto;}
  .card {min-width:250px;}
  .menu {flex-direction:column; align-items:center;}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="title">
  <div class="title-main">White Out Survival</div>
  <div class="title-sub">S2515 UNI&WON</div>
</div>

<!-- 🔥 버튼 정상 구조 -->
<div class="menu">
  <div class="btn" onclick="goLink()">💬 이민 문의</div>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">🛡 UNI 연맹</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">⚔ WON 연맹</div>
</div>

<!-- 모집 / 공약 -->
<div class="info-section">

<div class="info-card">
<div class="info-title" onclick="toggleInfo(this)">💙 모집 대상</div>
<div class="info-content">
<p>💙 모집 대상</p>
<p>· 개인 / 소규모 / 단체 이민 모두 환영합니다</p>
</div>
</div>

<div class="info-card">
<div class="info-title" onclick="toggleInfo(this)">📜 서버 공약</div>
<div class="info-content">
<p>💙 2515 서버 공약</p>
<p>· 안정적 운영</p>
</div>
</div>

</div>

<!-- 이벤트 출력 -->
<div id="content"></div>

<script>
/* 링크 */
function goLink(){
  window.open("https://open.kakao.com/o/sL7u8cYh","_blank");
}

/* 토글 */
function toggleInfo(el){
  el.nextElementSibling.classList.toggle("open");
}

/* 팀 선택 */
function selectTeam(team){
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");

  if(team==="UNI"){
    document.getElementById("uniBtn").classList.add("active");
    renderUNI();
  } else {
    document.getElementById("wonBtn").classList.add("active");
    renderWON();
  }
}

/* UNI */
function renderUNI(){
document.getElementById("content").innerHTML=`
<div class="grid">

<div class="card"><div class="card-header">🐻 곰</div>
<div class="time-box"><div class="time">21:00</div><div class="utc">(UTC 12:00)</div></div>
</div>

<div class="card"><div class="card-header">⚙ 무공</div>
<div class="time-box"><div class="time">21:00</div></div>
</div>

<div class="card"><div class="card-header">🏔 협곡</div>
<div class="time-box"><div class="time">21:00</div></div>
</div>

<div class="card"><div class="card-header">🎉 조이</div>
<div class="time-box"><div class="time">22:00</div></div>
</div>

</div>`;
}

/* WON */
function renderWON(){
document.getElementById("content").innerHTML=`
<div class="grid">

<div class="card"><div class="card-header">🐻 곰</div>
<div class="time-box"><div class="time">22:20</div></div>
</div>

<div class="card"><div class="card-header">⚙ 무공</div>
<div class="time-box"><div class="time">23:00</div></div>
</div>

<div class="card"><div class="card-header">🏔 협곡</div>
<div class="time-box"><div class="time">23:00</div></div>
</div>

<div class="card"><div class="card-header">🎉 조이</div>
<div class="time-box"><div class="time">21:00</div></div>
</div>

</div>`;
}

/* 눈꽃 */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();

let flakes=[];
for(let i=0;i<40;i++){
flakes.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
a:Math.random(),
f:Math.random()*0.02
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

flakes.forEach(f=>{
ctx.fillStyle=`rgba(0,150,255,${f.a})`;
ctx.font="20px Arial";
ctx.fillText("❄",f.x,f.y);

f.a+=f.f;
if(f.a>1||f.a<0) f.f*=-1;
});

requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
