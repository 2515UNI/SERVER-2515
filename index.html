<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Pretendard', sans-serif;
  background:#ffffff;
  overflow-x:hidden;
  color:#111;
}

/* 배경 */
#bg {
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:-1;
  pointer-events:none;
}

/* 타이틀 */
.title {
  text-align:center;
  margin-top:60px;
}

.title-main {
  font-family:'Poppins', sans-serif;
  font-size:48px;
}

.title-sub {
  font-family:'Poppins', sans-serif;
  font-size:80px;
  font-weight:900;
  letter-spacing:2px;

  background: linear-gradient(90deg, #00c6ff, #0072ff, #00c6ff);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  animation:shineText 5s linear infinite;

  -webkit-text-stroke:1.5px rgba(0,0,0,0.7);

  text-shadow:
    0 0 10px rgba(0,200,255,0.6),
    0 0 20px rgba(0,200,255,0.3);
}

@keyframes shineText {
  0% {background-position:0%;}
  100% {background-position:300%;}
}

/* 메뉴 */
.menu {
  display:flex;
  justify-content:center;
  gap:25px;
  margin-top:40px;
  flex-wrap:wrap;
}

/* 버튼 */
.btn {
  position:relative;
  min-width:220px;
  padding:22px 30px;
  border-radius:20px;

  background: linear-gradient(145deg, #ffffff, #e6f0ff);
  border:2px solid rgba(0, 150, 255, 0.3);

  font-family:'Poppins', sans-serif;
  font-size:20px;
  font-weight:800;

  text-align:center;
  cursor:pointer;

  box-shadow:
    0 10px 20px rgba(0,0,0,0.08),
    0 0 10px rgba(0,150,255,0.2);

  transition:all 0.25s ease;
}

.btn:hover {
  transform:translateY(-5px) scale(1.03);
  box-shadow:
    0 15px 30px rgba(0,0,0,0.12),
    0 0 20px rgba(0,150,255,0.4);
}

.btn:active {
  transform:scale(0.96);
}

.active {
  background: linear-gradient(145deg, #0072ff, #00c6ff);
  color:white;
  border:2px solid #0072ff;

  box-shadow:
    0 0 20px rgba(0,150,255,0.6),
    0 0 40px rgba(0,150,255,0.3);
}

/* 반짝 효과 */
.btn::after {
  content:'';
  position:absolute;
  inset:0;
  border-radius:20px;
  opacity:0;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
}

.btn:active::after {
  opacity:1;
  animation:shineBtn 0.5s;
}

@keyframes shineBtn {
  from { transform:translateX(-100%); }
  to { transform:translateX(100%); }
}

/* 모집/공약 */
.info-section {
  width:95%;
  max-width:1300px;
  margin:40px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.info-card {
  background:white;
  border-radius:25px;
  padding:35px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.info-title {
  font-family:'Poppins', sans-serif;
  font-size:28px;
  font-weight:900;
  cursor:pointer;
}

.info-content {
  max-height:0;
  overflow:hidden;
  transition:0.3s;
  font-size:18px;
  line-height:1.9;
  font-weight:600;
}

.info-content.open {
  max-height:3000px;
  margin-top:15px;
}

.info-content p {
  margin:8px 0;
  padding-left:10px;
  border-left:4px solid transparent;
  transition:0.3s;
}

.info-content p:hover {
  border-left:4px solid #00aaff;
  transform:translateX(5px);
  color:#0077cc;
}

/* 이벤트 */
.grid {
  width:95%;
  max-width:1400px;
  margin:30px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
}

.card {
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.card-header {
  font-size:22px;
  font-weight:800;
}

.time-box {
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  border:1.5px solid #ccc;
}

.time { font-size:30px; font-weight:900; }
.utc { font-size:12px; color:#333; }

/* 모바일 */
@media (max-width:900px){
  .grid { display:flex; overflow-x:auto; }
  .card { min-width:280px; }
  .info-section { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="title">
  <div class="title-main">White Out Survival Server</div>
  <div class="title-sub">2515 UNI & WON</div>
</div>

<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">💬 이민 문의</a>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">🛡 UNI 연맹</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">⚔ WON 연맹</div>
</div>

<div class="info-section">

<div class="info-card">
<div class="info-title" onclick="toggleInfo(this)">💙 모집 대상</div>
<div class="info-content">
<p>💙 모집 대상</p>
<p>· 단체 이민 (4월 특초 2장가능합니다)</p>
<p>· 특초 개인 이민</p>
<p>· 누구나 환영 :)</p>
</div>
</div>

<div class="info-card">
<div class="info-title" onclick="toggleInfo(this)">📜 서버 공약</div>
<div class="info-content">
<p>💙 2515 서버 공약</p>
<p>· 엔센 12개 보장</p>
<p>· 초기 지원</p>
</div>
</div>

</div>

<div id="content"></div>

<script>
/* 눈꽃 */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let flakes=[];
for(let i=0;i<50;i++){
  flakes.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*20+10,
    alpha:Math.random(),
    fade:Math.random()*0.02+0.005
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  flakes.forEach(f=>{
    ctx.font=f.size+"px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillStyle=`rgba(0,150,255,${f.alpha})`;
    ctx.fillText("❄",f.x,f.y);

    f.alpha+=f.fade;
    if(f.alpha>1||f.alpha<0) f.fade*=-1;
  });

  requestAnimationFrame(draw);
}
draw();

/* UI */
function toggleInfo(el){
  const content=el.nextElementSibling;
  content.classList.toggle("open");
}

function selectTeam(team){
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");
  document.getElementById(team.toLowerCase()+"Btn").classList.add("active");

  document.getElementById("content").innerHTML=
  team==="UNI" ? `<div class="grid"><div class="card">UNI 이벤트</div></div>`
               : `<div class="grid"><div class="card">WON 이벤트</div></div>`;
}
</script>

</body>
</html>
