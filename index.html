<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1a24;
  color:white;
  text-align:center;
}

/* 눈 효과 */
.snow {
  position:fixed;
  width:100%;
  height:100%;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size:20px 20px;
  animation:snow 20s linear infinite;
  opacity:0.2;
}

@keyframes snow {
  from { transform: translateY(-100px); }
  to { transform: translateY(100vh); }
}

/* 제목 */
h1 {
  margin-top:50px;
  font-size:45px;
  text-shadow:0 0 10px #00ccff;
}

/* 버튼 */
.menu {
  margin:20px;
}

.btn {
  display:inline-block;
  margin:5px;
  padding:10px 20px;
  background:#1f3a4a;
  border-radius:8px;
  color:white;
  text-decoration:none;
}

.btn:hover {
  background:#00ccff;
}

/* 박스 */
.box {
  width:320px;
  margin:20px auto;
  padding:15px;
  background:#1a2a35;
  border-radius:10px;
  text-align:left;
}

.title {
  text-align:center;
  font-size:22px;
  color:#00ccff;
  margin-bottom:10px;
}

.section {
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="snow"></div>

<h1>SERVER 2515</h1>

<!-- 버튼 -->
<div class="menu">
  <a class="btn" href="#">이민 문의</a>
  <a class="btn" href="#">UNI 연맹소개</a>
  <a class="btn" href="#">KOR 연맹소개</a>
</div>

<!-- UNI -->
<div class="box">
  <div class="title">UNI 연맹</div>

  <div class="section">곰</div>
  <p>곰 1 : 21:00</p>
  <p>곰 2 : 22:00</p>
  <p>곰 3 : 23:10</p>

  <div class="section">무기공장</div>
  <p>1군 : 21:00</p>
  <p>2군 : 22:00</p>

  <div class="section">협곡</div>
  <p>1군 : 21:00</p>
  <p>2군 : 22:00</p>

  <div class="section">조이</div>
  <p>22:00</p>
</div>

<!-- KOR -->
<div class="box">
  <div class="title">KOR 연맹</div>

  <div class="section">곰</div>
  <p>곰 1 : 22:30</p>
  <p>곰 2 : 24:00</p>
</div>

</body>
</html>
