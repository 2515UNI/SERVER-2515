<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<!-- 폰트 -->
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: 'Pretendard', sans-serif;
  background:#f8fafc;
  color:#111;
}

/* 타이틀 */
.title {
  text-align:center;
  font-size:52px;
  font-weight:800;
  margin:40px 0;
  animation: drop 0.8s ease;
}

@keyframes drop {
  from {transform:translateY(-60px); opacity:0;}
  to {transform:translateY(0); opacity:1;}
}

/* 버튼 */
.menu {
  text-align:center;
}

.btn {
  display:inline-block;
  margin:8px;
  padding:14px 28px;
  border-radius:14px;
  background:white;
  border:1px solid #ddd;
  cursor:pointer;
  transition:0.2s;
}

/* 클릭 애니메이션 */
.btn:active {
  transform:scale(0.95);
}

.btn:hover {
  background:#111;
  color:white;
}

.active {
  background:#111;
  color:white;
}

/* 그리드 */
.grid {
  width:95%;
  max-width:1400px;
  margin:30px auto;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:20px;
}

/* 카드 */
.card {
  background:linear-gradient(145deg,#ffffff,#f1f5f9);
  border-radius:25px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  position:relative;
  overflow:hidden;
}

/* ✨ 펄 효과 */
.card::after {
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
  transition:0.6s;
}

.card:hover::after {
  left:100%;
}

/* 제목 */
.card-header {
  font-size:24px;
  font-weight:700;
}

/* 시간 박스 */
.time-box {
  background:#ffffff;
  border-radius:18px;
  padding:16px;
  margin-top:12px;
  border:1px solid #eee;
}

/* 라벨 */
.label {
  font-size:13px;
  color:#888;
}

/* 시간 */
.time {
  font-size:34px;
  font-weight:800;
}

/* UTC */
.utc {
  font-size:12px;
  color:#aaa;
}

/* 🔥 활성 이벤트 */
.active-event {
  border:2px solid #00ccff;
  box-shadow:0 0 20px rgba(0,200,255,0.3);
}

/* 모바일 */
@media (max-width:900px){
  .grid {
    display:flex;
    overflow-x:auto;
  }
  .card {
    min-width:280px;
  }
}
</style>
</head>

<body>

<div class="title">🚀 SERVER 2515</div>

<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">💬 이민 문의</a>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">UNI</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">WON</div>
</div>

<div id="content"></div>

<script>
function getActiveClass(hour, min){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const target = hour*60 + min;

  if(Math.abs(nowMin - target) < 30){
    return "active-event";
  }
  return "";
}

function selectTeam(team){
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");
  document.getElementById(team.toLowerCase()+"Btn").classList.add("active");

  if(team==="UNI") renderUNI();
  else renderWON();
}

function renderUNI(){
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card">
        <div class="card-header">🐻 곰 사냥</div>

        <div class="time-box ${getActiveClass(21,0)}">
          <div class="label">곰1</div>
          <div class="time">21:00</div>
          <div class="utc">(UTC 12:00)</div>
        </div>

        <div class="time-box ${getActiveClass(22,0)}">
          <div class="label">곰2</div>
          <div class="time">22:00</div>
          <div class="utc">(UTC 13:00)</div>
        </div>

        <div class="time-box ${getActiveClass(23,10)}">
          <div class="label">곰3</div>
          <div class="time">23:10</div>
          <div class="utc">(UTC 14:10)</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">⚙ 무기공장</div>

        <div class="time-box ${getActiveClass(21,0)}">
          <div class="label">1군</div>
          <div class="time">21:00</div>
          <div class="utc">(UTC 12:00)</div>
        </div>

        <div class="time-box ${getActiveClass(23,0)}">
          <div class="label">2군</div>
          <div class="time">23:00</div>
          <div class="utc">(UTC 14:00)</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">🏔 협곡</div>

        <div class="time-box ${getActiveClass(21,0)}">
          <div class="label">1군</div>
          <div class="time">21:00</div>
          <div class="utc">(UTC 12:00)</div>
        </div>

        <div class="time-box ${getActiveClass(23,0)}">
          <div class="label">2군</div>
          <div class="time">23:00</div>
          <div class="utc">(UTC 14:00)</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">🎉 조이</div>

        <div class="time-box ${getActiveClass(22,0)}">
          <div class="label">이벤트</div>
          <div class="time">22:00</div>
          <div class="utc">(UTC 13:00)</div>
        </div>
      </div>

    </div>
  `;
}

function renderWON(){
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card">
        <div class="card-header">🐻 곰 사냥</div>

        <div class="time-box ${getActiveClass(22,30)}">
          <div class="label">곰1</div>
          <div class="time">22:30</div>
          <div class="utc">(UTC 13:30)</div>
        </div>

        <div class="time-box ${getActiveClass(24,0)}">
          <div class="label">곰2</div>
          <div class="time">24:00</div>
          <div class="utc">(UTC 15:00)</div>
        </div>
      </div>

    </div>
  `;
}
</script>

</body>
</html>
