<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  color:white;
  text-align:center;
  background: url('https://images.unsplash.com/photo-1608889175119-3e3b2d1d9c0d?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
  background-size: cover;
}

/* 어둡게 덮기 */
.overlay {
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.65);
  z-index:0;
}

/* 눈 효과 */
.snow {
  position:fixed;
  width:100%;
  height:100%;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size:20px 20px;
  animation:snow 20s linear infinite;
  opacity:0.3;
  pointer-events:none;
  z-index:1;
}

@keyframes snow {
  from { transform: translateY(-100px); }
  to { transform: translateY(100vh); }
}

/* 컨텐츠 */
.container {
  position:relative;
  z-index:2;
}

/* 제목 */
h1 {
  margin-top:40px;
  font-size:50px;
  text-shadow:0 0 20px #00ccff;
}

/* 메뉴 */
.menu {
  margin:30px;
}

/* 버튼 */
.btn {
  display:block;
  width:240px;
  margin:12px auto;
  padding:14px;
  border-radius:12px;
  background: linear-gradient(135deg, #1f3a4a, #12232e);
  cursor:pointer;
  transition:0.3s;
  font-weight:bold;
  color:white; /* ⭐ 글씨색 강제 지정 */
}

.btn:hover {
  transform:scale(1.05);
  background: linear-gradient(135deg, #00ccff, #0077aa);
  color:white;
}

/* 선택된 버튼 */
.active {
  background: linear-gradient(135deg, #00ccff, #005577);
  box-shadow:0 0 15px #00ccff;
}

/* 박스 */
.box {
  width:330px;
  margin:20px auto;
  padding:20px;
  border-radius:15px;
  background:rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  text-align:left;
  box-shadow:0 0 20px rgba(0,200,255,0.3);
}

.title {
  text-align:center;
  font-size:24px;
  color:#00ccff;
  margin-bottom:15px;
}

.section {
  margin-top:15px;
  font-weight:bold;
  color:#00ccff;
}
</style>
</head>

<body>

<div class="overlay"></div>
<div class="snow"></div>

<div class="container">

<h1>🔥 SERVER 2515 🔥</h1>

<!-- 메뉴 -->
<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">💬 이민 문의</a>
  <div class="btn" id="btnUNI" onclick="showUNI()">🛡 UNI 연맹소개</div>
  <div class="btn" id="btnKOR" onclick="showKOR()">⚔ KOR 연맹소개</div>
</div>

<!-- 내용 -->
<div id="content">
  <p>연맹을 선택하세요</p>
</div>

</div>

<script>
function resetActive() {
  document.getElementById("btnUNI").classList.remove("active");
  document.getElementById("btnKOR").classList.remove("active");
}

function showUNI() {
  resetActive();
  document.getElementById("btnUNI").classList.add("active");

  document.getElementById("content").innerHTML = `
    <div class="box">
      <div class="title">🛡 UNI 연맹</div>

      <div class="section">🐻 곰</div>
      <p>곰 1 : 21:00</p>
      <p>곰 2 : 22:00</p>
      <p>곰 3 : 23:10</p>

      <div class="section">⚙ 무기공장</div>
      <p>1군 : 21:00</p>
      <p>2군 : 22:00</p>

      <div class="section">🏔 협곡</div>
      <p>1군 : 21:00</p>
      <p>2군 : 22:00</p>

      <div class="section">🎉 조이</div>
      <p>22:00</p>
    </div>
  `;
}

function showKOR() {
  resetActive();
  document.getElementById("btnKOR").classList.add("active");

  document.getElementById("content").innerHTML = `
    <div class="box">
      <div class="title">⚔ KOR 연맹</div>

      <div class="section">🐻 곰</div>
      <p>곰 1 : 22:30</p>
      <p>곰 2 : 24:00</p>
    </div>
  `;
}
</script>

</body>
</html>
