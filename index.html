<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#f7f9fc;
  color:#111;
}

/* 타이틀 애니메이션 */
.title {
  text-align:center;
  font-size:48px;
  font-weight:bold;
  margin-top:40px;
  opacity:0;
  transform:translateY(-80px);
  animation:titleDrop 1s ease forwards;
}

@keyframes titleDrop {
  0% {opacity:0; transform:translateY(-80px);}
  70% {transform:translateY(10px);}
  100% {opacity:1; transform:translateY(0);}
}

/* 메뉴 */
.menu {
  text-align:center;
  margin:30px;
}

.btn {
  display:inline-block;
  margin:10px;
  padding:14px 26px;
  border-radius:12px;
  background:white;
  border:1px solid #ddd;
  cursor:pointer;
  font-size:16px;
  transition:0.3s;
}

.btn:hover {
  background:#111;
  color:white;
}

.active {
  background:#111;
  color:white;
}

/* 카드 영역 */
.grid {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:20px;
  width:90%;
  margin:30px auto;
}

/* 카드 */
.card {
  background:white;
  border-radius:20px;
  padding:20px;
  border:1px solid #eee;
  transition:0.3s;
  position:relative;
}

.card:hover {
  transform:translateY(-6px);
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* 카드 헤더 */
.card-header {
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

/* 시간 */
.time-box {
  background:#f4f6f8;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}

.time {
  font-size:22px;
  font-weight:bold;
}

/* 포인트 라인 */
.bear { border-top:4px solid #e67e22; }
.factory { border-top:4px solid #7f8c8d; }
.valley { border-top:4px solid #27ae60; }
.joy { border-top:4px solid #9b59b6; }

/* 모바일 */
@media (max-width:900px){
  .grid { grid-template-columns: repeat(2,1fr); }
}

@media (max-width:500px){
  .grid { grid-template-columns:1fr; }
  .title { font-size:36px; }
}
</style>
</head>

<body>

<div class="title">🚀 SERVER 2515</div>

<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">💬 이민 문의</a>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">UNI</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">WON</div>
</div>

<div id="content"></div>

<script>
function selectTeam(team) {
  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");
  document.getElementById(team.toLowerCase()+"Btn").classList.add("active");

  if (team === "UNI") renderUNI();
  else renderWON();
}

function renderUNI() {
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card bear">
        <div class="card-header">🐻 곰 사냥</div>
        <div class="time-box">곰1 <div class="time">21:00</div></div>
        <div class="time-box">곰2 <div class="time">22:00</div></div>
        <div class="time-box">곰3 <div class="time">23:10</div></div>
      </div>

      <div class="card factory">
        <div class="card-header">⚙ 무기공장</div>
        <div class="time-box">1군 <div class="time">21:00</div></div>
        <div class="time-box">2군 <div class="time">22:00</div></div>
      </div>

      <div class="card valley">
        <div class="card-header">🏔 협곡</div>
        <div class="time-box">1군 <div class="time">21:00</div></div>
        <div class="time-box">2군 <div class="time">22:00</div></div>
      </div>

      <div class="card joy">
        <div class="card-header">🎉 조이</div>
        <div class="time-box">이벤트 <div class="time">22:00</div></div>
      </div>

    </div>
  `;
}

function renderWON() {
  document.getElementById("content").innerHTML = `
    <div class="grid">

      <div class="card bear">
        <div class="card-header">🐻 곰 사냥</div>
        <div class="time-box">곰1 <div class="time">22:30</div></div>
        <div class="time-box">곰2 <div class="time">24:00</div></div>
      </div>

      <div class="card factory"><div class="card-header">⚙ 무기공장</div><div class="time-box">정보 없음</div></div>
      <div class="card valley"><div class="card-header">🏔 협곡</div><div class="time-box">정보 없음</div></div>
      <div class="card joy"><div class="card-header">🎉 조이</div><div class="time-box">정보 없음</div></div>

    </div>
  `;
}
</script>

</body>
</html>
