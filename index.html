<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<!-- 🔥 모바일 흔들림 방지 핵심 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>SERVER 2515</title>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
html, body {
  margin:0;
  height:100%;
  font-family:'Pretendard';
  background:#fff;
  color:#111;

  /* 🔥 갤럭시 스크롤 튐 방지 */
  overflow-x:hidden;
  overscroll-behavior:none;
}

canvas {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
  pointer-events:none;
}

/* 타이틀 */
.title {text-align:center;margin-top:60px;}
.title-main, .title-sub {
  font-weight:900;
  color:#fff;
  -webkit-text-stroke: 2px #000;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.35);
  position:relative;
  display:inline-block;
}
.title-main {
  font-size:48px;
  letter-spacing:2px;
  animation:titlePop 0.8s ease;
}
.title-main::after{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:50%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.4),transparent);
  animation:shine 2s infinite;
}
.title-sub {
  font-size:90px;
  transform: skewX(-5deg);
  animation:titlePop 1s ease;
}
.title-sub::after{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:50%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.3),transparent);
  animation:shine 2.5s infinite;
}
.title-line{
  width:120px;height:3px;
  margin:20px auto 0;
  border-radius:10px;
  background:linear-gradient(90deg,transparent,#999,transparent);
}
@keyframes shine{0%{left:-100%;}100%{left:120%;}}
@keyframes titlePop{0%{opacity:0;transform:translateY(-20px);}100%{opacity:1;transform:translateY(0);}}

/* 메뉴 */
.menu {
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:40px;
  flex-wrap:wrap;
}
.btn {
  min-width:220px;
  padding:20px;
  border-radius:18px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(0,0,0,0.1);
  background:linear-gradient(145deg,#ffffff,#f3f3f3);
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
}
.btn::after{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:50%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.8),transparent);
  transition:0.6s;
}
.btn:hover::after{left:120%;}
.btn:hover{transform:translateY(-4px) scale(1.02);}
.btn:active{transform:scale(0.96);}
.btn.active{background:#eaeaea;}

/* 정보 */
.info-section {
  width:95%;
  max-width:1300px;
  margin:40px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}
.info-card {
  padding:40px;
  border-radius:22px;
  background:linear-gradient(145deg,#ffffff,#f3f3f3);
  border:2px solid #000;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}
.info-title{font-size:28px;font-weight:900;}
.info-content{font-size:17px;line-height:1.9;font-weight:700;}
.hidden{display:none;}

/* 이벤트 */
.grid {
  width:95%;
  margin:40px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}
.card {
  padding:25px;
  border-radius:22px;
  background:linear-gradient(145deg,#ffffff,#f3f3f3);
  border:2px solid #000;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  opacity:0;
  transform:translateY(30px);
  transition:all 0.3s ease;
}
.card.show{animation:fadeUp 0.6s ease forwards;}
.card:hover{transform:translateY(-6px) scale(1.02);}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

.card-header{font-size:26px;font-weight:900;margin-bottom:18px;}

.time-box{
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  background:linear-gradient(145deg,#fdfdfd,#f0f0f0);
  border:1px solid #000;
  transition:0.2s;
}
.time-box:hover{transform:scale(1.02);}
.time{font-size:22px;font-weight:900;}
.utc{font-size:14px;color:#777;}

/* 모바일 */
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr);}
  .info-section{grid-template-columns:1fr;}
}
@media(max-width:500px){
  .grid{grid-template-columns:1fr;}
  .title-sub{font-size:50px;}
  .btn{min-width:160px;font-size:16px;padding:16px;}
}

/* 하단 */
.footer{text-align:center;margin:60px 0 30px;font-size:14px;color:#777;}
</style>
</head>

<body>

<canvas id="snow"></canvas>

<div class="title">
  <div class="title-main">White Out Survival</div>
  <div class="title-sub">S2515 UNI&WON</div>
  <div class="title-line"></div>
</div>

<div class="menu">
  <div class="btn" onclick="goLink()">💬 이민 문의</div>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">🛡 UNI 연맹</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">⚔ WON 연맹</div>
</div>

<div class="info-section" id="infoSection">
  <div class="info-card">
    <div class="info-title">💙 모집 대상</div>
    <div class="info-content">
      · 개인 / 소규모 / 단체 이민 모두 환영합니다<br><br>
      · UNI : 소수 인원 / WON : 단체 인원 수용 가능<br><br>
      · 함께 성장하실 분 환영합니다 :)
    </div>
  </div>

  <div class="info-card">
    <div class="info-title">💙 서버 혜택</div>
    <div class="info-content">
      · 엔센 12개 보장<br>
      · 요새/성채 제공<br>
      · 서버전 적극 참여<br>
    </div>
  </div>
</div>

<div id="content" style="display:none;"></div>

<div class="footer">Made by 우짱</div>

<script>
function goLink(){
  window.open("https://open.kakao.com/o/sL7u8cYh","_blank");
}

function selectTeam(team){
  document.getElementById("infoSection").style.display="none";
  document.getElementById("content").style.display="block";

  if(team==="UNI"){renderUNI();}
  else{renderWON();}
}

function showCards(){
  document.querySelectorAll(".card").forEach((c,i)=>{
    setTimeout(()=>c.classList.add("show"),i*120);
  });
}

function renderUNI(){
document.getElementById("content").innerHTML=`
<div class="grid">
<div class="card"><div class="card-header">🐻 곰</div>
<div class="time-box"><div class="time">곰 1 - 21:00</div></div>
<div class="time-box"><div class="time">곰 2 - 22:00</div></div>
</div>
</div>`;
showCards();
}

function renderWON(){
document.getElementById("content").innerHTML=`
<div class="grid">
<div class="card"><div class="card-header">🐻 곰</div>
<div class="time-box"><div class="time">곰 1 - 22:20</div></div>
</div>
</div>`;
showCards();
}

/* 🔥 canvas 안정화 */
const canvas=document.getElementById("snow");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* 눈꽃 */
let flakes=[];
for(let i=0;i<60;i++){
  flakes.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*8+5,speed:Math.random()*1});
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  flakes.forEach(f=>{
    ctx.font=f.size+"px Arial";
    ctx.fillStyle="#6ec6ff";
    ctx.fillText("❄",f.x,f.y);
    f.y+=f.speed;
    if(f.y>canvas.height){f.y=0;f.x=Math.random()*canvas.width;}
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
