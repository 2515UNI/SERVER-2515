<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0a0f14;
  color:white;
  text-align:center;
}

/* 배경 그라데이션 */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background: radial-gradient(circle at top, rgba(0,150,255,0.2), transparent 70%);
  z-index:0;
}

/* 컨텐츠 */
.container {
  position:relative;
  z-index:1;
}

/* 제목 */
h1 {
  margin-top:40px;
  font-size:48px;
  text-shadow:0 0 20px #00ccff;
}

/* 메뉴 */
.menu {
  margin:30px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
}

/* 버튼 */
.btn {
  margin:10px;
  padding:12px 25px;
  border-radius:10px;
  background:#111a22;
  border:1px solid rgba(0,200,255,0.3);
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover {
  background:#00ccff;
  color:black;
}

/* 선택된 버튼 */
.active {
  background:#00ccff;
  color:black;
  box-shadow:0 0 15px #00ccff;
}

/* 카드 */
.card {
  width:360px;
  margin:30px auto;
  padding:20px;
  border-radius:15px;
  background:#111a22;
  border:1px solid rgba(0,200,255,0.2);
  box-shadow:0 0 20px rgba(0,200,255,0.1);
  text-align:left;
}

/* 카드 제목 */
.title {
  text-align:center;
  font-size:24px;
  color:#00ccff;
  margin-bottom:15px;
}

/* 섹션 */
.section {
  margin-top:15px;
  font-weight:bold;
  color:#00ccff;
}

/* 내용 */
p {
  margin:5px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 SERVER 2515 🔥</h1>

<!-- 메뉴 -->
<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">이민 문의</a>
  <div class="btn" id="btnUNI" onclick="showUNI()">UNI 연맹</div>
  <div class="btn" id="btnKOR" onclick="showKOR()">KOR 연맹</div>
</div>

<!-- 내용 -->
<div id="content">
  <p>연맹을 선택하세요</p>
</div>

</div>

<script>
function resetActive() {
  document.getElementById("btnUNI").classList.remove("active");
  document.getElementById("btnKOR").classList.remove("active");
}

function showUNI() {
  resetActive();
  document.getElementById("btnUNI").classList.add("active");

  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="title">UNI 연맹</div>

      <div class="section">🐻 곰</div>
      <p>곰 1 : 21:00</p>
      <p>곰 2 : 22:00</p>
      <p>곰 3 : 23:10</p>

      <div class="section">⚙ 무기공장</div>
      <p>1군 : 21:00</p>
      <p>2군 : 22:00</p>

      <div class="section">🏔 협곡</div>
      <p>1군 : 21:00</p>
      <p>2군 : 22:00</p>

      <div class="section">🎉 조이</div>
      <p>22:00</p>
    </div>
  `;
}

function showKOR() {
  resetActive();
  document.getElementById("btnKOR").classList.add("active");

  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="title">KOR 연맹</div>

      <div class="section">🐻 곰</div>
      <p>곰 1 : 22:30</p>
      <p>곰 2 : 24:00</p>
    </div>
  `;
}
</script>

</body>
</html>
