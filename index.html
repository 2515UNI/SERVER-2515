<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SERVER 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  color:#222;
  text-align:center;
  overflow-x:hidden;

  /* 밝은 그라데이션 애니메이션 */
  background: linear-gradient(270deg, #dff3ff, #ffffff, #eaf8ff);
  background-size: 600% 600%;
  animation: bgMove 10s ease infinite;
}

@keyframes bgMove {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* 제목 */
h1 {
  margin-top:30px;
  font-size:42px;
}

/* 버튼 */
.menu {
  margin:20px;
}

.btn {
  display:inline-block;
  margin:6px;
  padding:10px 20px;
  border-radius:10px;
  background:#2c3e50;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover {
  background:#3498db;
}

/* 선택 */
.active {
  background:#3498db;
}

/* 카드 */
.card {
  width:360px;
  margin:25px auto;
  padding:20px;
  border-radius:15px;
  background:white;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
  text-align:left;
}

/* 섹션 */
.section {
  margin-top:10px;
}

/* 탭 */
.tabs {
  margin-top:15px;
}

.tab {
  display:inline-block;
  margin:5px;
  padding:8px 12px;
  border-radius:8px;
  background:#ddd;
  cursor:pointer;
}

.tab.active {
  background:#3498db;
  color:white;
}
</style>
</head>

<body>

<h1>🔥 SERVER 2515 🔥</h1>

<!-- 상단 -->
<div class="menu">
  <a class="btn" href="https://open.kakao.com/o/sL7u8cYh" target="_blank">이민 문의</a>
  <div class="btn" id="uniBtn" onclick="selectTeam('UNI')">UNI</div>
  <div class="btn" id="wonBtn" onclick="selectTeam('WON')">WON</div>
</div>

<!-- 내용 -->
<div id="content">
  <p>연맹을 선택하세요</p>
</div>

<script>
let currentTeam = "";
let currentTab = "bear";

function selectTeam(team) {
  currentTeam = team;

  document.getElementById("uniBtn").classList.remove("active");
  document.getElementById("wonBtn").classList.remove("active");

  document.getElementById(team.toLowerCase() + "Btn").classList.add("active");

  render();
}

function selectTab(tab) {
  currentTab = tab;
  render();
}

function render() {
  if (!currentTeam) return;

  let content = "";

  if (currentTeam === "UNI") {
    if (currentTab === "bear") content = "곰 1 : 21:00<br>곰 2 : 22:00<br>곰 3 : 23:10";
    if (currentTab === "factory") content = "1군 : 21:00<br>2군 : 22:00";
    if (currentTab === "valley") content = "1군 : 21:00<br>2군 : 22:00";
    if (currentTab === "joy") content = "22:00";
  }

  if (currentTeam === "WON") {
    if (currentTab === "bear") content = "곰 1 : 22:30<br>곰 2 : 24:00";
    else content = "정보 없음";
  }

  document.getElementById("content").innerHTML = `
    <div class="card">

      <div style="text-align:center; font-weight:bold;">
        ${currentTeam} 연맹
      </div>

      <!-- 탭 -->
      <div class="tabs">
        <div class="tab ${currentTab==='bear'?'active':''}" onclick="selectTab('bear')">🐻 곰</div>
        <div class="tab ${currentTab==='factory'?'active':''}" onclick="selectTab('factory')">⚙ 무기</div>
        <div class="tab ${currentTab==='valley'?'active':''}" onclick="selectTab('valley')">🏔 협곡</div>
        <div class="tab ${currentTab==='joy'?'active':''}" onclick="selectTab('joy')">🎉 조이</div>
      </div>

      <div class="section">
        ${content}
      </div>

    </div>
  `;
}
</script>

</body>
</html>
